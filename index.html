<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>modoi — your proactive Mac companion</title>
<meta name="description" content="modoi learns your behavior, nudges before you ask, and streamlines how you work. The more you train it, the more it works for you." />

<meta property="og:title" content="modoi — your proactive Mac companion" />
<meta property="og:description" content="modoi learns your behavior and works for you, proactively." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #241d26;
    --muted: rgba(36, 29, 38, 0.66);
    --faint: rgba(36, 29, 38, 0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* Hero image #7 — pink & white paint */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background-image: url("https://images.unsplash.com/photo-1563305145-b64e0c2184aa?q=90&auto=format&fit=crop&w=2400");
    background-size: cover;
    background-position: center;
  }

  /* Soft light scrim to lift text off the paint */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(60% 45% at 50% 52%, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.10) 100%);
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 44px;
    position: relative;
    z-index: 2;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: var(--ink);
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 34px; }
  .nav-links a {
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0.2px;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }
  .nav-links a:hover { opacity: 0.55; }

  .hero-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 90px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 7vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  .subline {
    margin-top: 34px;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
  }
  .subline .drop { display: block; margin-top: 6px; color: var(--faint); }

  .cta { margin-top: 44px; }
  .btn {
    font-size: 15px;
    letter-spacing: 0.2px;
    padding: 13px 30px;
    border-radius: 2px;
    text-decoration: none;
    background: var(--ink);
    color: #fff;
    transition: opacity 0.2s ease;
    display: inline-block;
  }
  .btn:hover { opacity: 0.85; }

  @media (max-width: 640px) {
    nav { padding: 22px 22px; }
    .nav-links { gap: 20px; }
    .nav-links a { font-size: 14px; }
    .logo { font-size: 26px; }
  }
</style>
</head>
<body>
  <section class="hero">
    <nav>
      <a href="#" class="logo">modoi</a>
      <div class="nav-links">
        <a href="#vision">Vision</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>

    <div class="hero-body">
      <h1>your mac, now a companion</h1>
      <p class="subline">
        modoi learns your behavior and works before you ask.
        <span class="drop">the more you train it, the more it works for you</span>
      </p>
      <div class="cta">
        <a href="#" class="btn">TBD</a>
      </div>
    </div>
  </section>
</body>
</html>
